# SonarQube configuration for SkillSwap.
# Used by the Jenkins pipeline and by a local `sonar-scanner` run.

sonar.projectKey=skillswap
sonar.projectName=SkillSwap - No Money Economy Platform
sonar.projectVersion=1.0.0

sonar.sources=server/src,client/src
sonar.tests=server/tests
sonar.test.inclusions=server/tests/**/*.test.js

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.config.js,\
  client/public/**

sonar.javascript.lcov.reportPaths=server/coverage/lcov.info
sonar.sourceEncoding=UTF-8

# The SPA entry and generated assets are not meaningful duplication targets.
sonar.cpd.exclusions=**/*.test.js,client/src/pages/**

# --- Rule exclusions, with reasons ----------------------------------------
# Each entry below is a rule that does not hold for this codebase. They are
# listed individually, with a justification, rather than lowering the quality
# gate - a suppression nobody can explain later is worse than the warning.

# S4123 "await should only be used with promises".
# Every hit is an `await` on a Mongoose query. A Query is a thenable, not a
# native Promise, and Sonar's type inference cannot tell the difference.
# Awaiting a thenable is correct JavaScript; satisfying the rule would mean
# wrapping every database call in Promise.resolve(), which is strictly worse.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S4123
sonar.issue.ignore.multicriteria.e1.resourceKey=server/src/**/*.js

# S4662 "Unexpected unknown at-rule".
# Tailwind v4 introduces @theme and @utility. The CSS analyser predates them
# and reports valid directives as errors.
sonar.issue.ignore.multicriteria.e2.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.e2.resourceKey=client/src/index.css

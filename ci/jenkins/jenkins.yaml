# Jenkins Configuration as Code.
#
# Everything the SkillSwap pipeline expects is declared here, so a fresh
# container comes up with the job, the tools and the SonarQube link already
# wired instead of needing a tour of the admin UI.
#
# Secrets are read from the environment (docker compose passes them in from
# .env.ci) and never live in this file.

jenkins:
  systemMessage: "SkillSwap CI - Jenkins, SonarQube, Docker. Configured as code."
  numExecutors: 2
  mode: NORMAL

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD:-changeme}"

  # matrix-auth rather than the core loggedInAuthorizationStrategy: the core
  # symbol is not resolvable by this Jenkins/JCasC combination, and an
  # explicit matrix is clearer about who can do what anyway.
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID:-admin}"
            permissions:
              - "Overall/Administer"

# The job itself is not defined here. job-dsl's JCasC seed-job integration
# fails against this configuration-as-code version with
# NoClassDefFoundError: io/vavr/CheckedFunction0Module, which aborts the whole
# boot. ci/jenkins/create-job.sh posts the job's config.xml to the REST API
# instead - fewer moving parts, and no plugin version to keep in step.

tool:
  git:
    installations:
      - name: "Default"
        home: "git"

  # Node is baked into the image, so point the tool at it rather than
  # downloading a second copy on every build.
  nodejs:
    installations:
      - name: "NodeJS-20"
        home: "/usr"

  sonarRunnerInstallation:
    installations:
      - name: "SonarScanner"
        properties:
          - installSource:
              installers:
                - sonarRunnerInstaller:
                    id: "6.2.1.4610"

unclassified:
  # Matches withSonarQubeEnv('SonarQube') in the Jenkinsfile.
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonarqube-token"

  location:
    url: "http://localhost:8081/"

credentials:
  system:
    domainCredentials:
      - credentials:
          # Generated in the SonarQube UI, then pasted into .env.ci.
          # Left empty the analysis stage simply fails with a clear 401.
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              secret: "${SONAR_TOKEN:-}"
              description: "SonarQube analysis token"

          # Filled in at Stage B, when Docker Hub comes into play.
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-credentials"
              username: "${DOCKERHUB_USERNAME:-}"
              password: "${DOCKERHUB_TOKEN:-}"
              description: "Docker Hub - use an access token, not the account password"
